# Default values for kubeedge.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
appVersion: "1.23.0"

cloudCore:
  replicaCount: 1
  hostNetWork: true
  image:
    repository: "kubeedge/cloudcore"
    tag: "v1.23.0"
    pullPolicy: "IfNotPresent"
    pullSecrets: []
  securityContext:
    privileged: true
  labels:
    k8s-app: kubeedge
    kubeedge: cloudcore
  annotations: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/edge
            operator: DoesNotExist
  tolerations: []
  nodeSelector: {}
  resources:
    limits:
      cpu: 200m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 512Mi
  strategy: {}
  featureGate:
    requireAuthorization: false
  modules:
    cloudHub:
      # Caution!: Leave this entry to empty will cause CloudCore to exit abnormally once ContinuumX is enabled.
      # At least a public IP Address or an IP which can be accessed by edge nodes must be provided!
      advertiseAddress:
        - ""
      dnsNames:
        - ""
      nodeLimit: "1000"
      websocket:
        enable: true
      quic:
        enable: false
        maxIncomingStreams: "10000"
      https:
        enable: true
    cloudStream:
      enable: true
    dynamicController:
      enable: false
    router:
      enable: false
    taskManager:
      enable: false
  service:
    enable: true
    type: "NodePort"
    cloudhubNodePort: "30000"
    cloudhubQuicNodePort: "30001"
    cloudhubHttpsNodePort: "30002"
    cloudstreamNodePort: "30003"
    tunnelNodePort: "30004"
    annotations: {}

iptablesManager:
  enable: true
  mode: "external"
  hostNetWork: true
  image:
    repository: "kubeedge/iptables-manager"
    tag: "v1.23.0"
    pullPolicy: "IfNotPresent"
    pullSecrets: []
  securityContext:
    capabilities:
      add:
        - NET_ADMIN
        - NET_RAW
  labels:
    k8s-app: iptables-manager
    kubeedge: iptables-manager
  annotations: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role.kubernetes.io/edge
            operator: DoesNotExist
  tolerations: []
  nodeSelector: {}
  resources:
    limits:
      cpu: 200m
      memory: 50Mi
    requests:
      cpu: 100m
      memory: 25Mi

controllerManager:
  enable: false
  image:
    repository: "kubeedge/controller-manager"
    tag: "v1.23.0"
    pullPolicy: "IfNotPresent"
    pullSecrets: []
  labels:
    k8s-app: controller-manager
    kubeedge: controller-manager
  annotations: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/edge
                operator: DoesNotExist
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  nodeSelector: {}
  resources:
    limits:
      cpu: 200m
      memory: 50Mi
    requests:
      cpu: 100m
      memory: 25Mi

admission:
  enable: false
  replicaCount: 1
  certsSecretName: ""
  image:
    repository: "kubeedge/admission"
    tag: "v1.23.0"
    pullPolicy: "IfNotPresent"
    pullSecrets: []
  labels:
    k8s-app: kubeedge-admission
    kubeedge: kubeedge-admission
  annotations: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/edge
                operator: DoesNotExist
  tolerations: []
  nodeSelector: {}
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 64Mi

mosquitto:
  enable: true
  image:
    repository: eclipse-mosquitto
    tag: "1.6.15"
    pullPolicy: "IfNotPresent"
    pullSecrets: []
  labels:
    k8s-app: eclipse-mosquitto
    kubeedge: eclipse-mosquitto
  annotations: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/edge
                operator: Exists
  tolerations: []
  resources:
    limits:
      cpu: 200m
      memory: 100Mi
    requests:
      cpu: 100m
      memory: 50Mi

# Device Twins Resources Publisher (UP2DATE4SDV CID 93). Publishes nodes and device twins
# to authorised consumers over Interface I-4. Disabled by default.
dtPublisher:
  enable: false
  image:
    repository: "neotera/dtpublisher"
    tag: "v1.23.0"
    pullPolicy: "IfNotPresent"
    pullSecrets: []
  labels:
    k8s-app: dtpublisher
    kubeedge: dtpublisher
  annotations: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/edge
                operator: DoesNotExist
  tolerations: []
  nodeSelector: {}
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  # Log verbosity (klog -v).
  logLevel: 2
  # What is published. Annotations are not published unless their keys are listed.
  sources:
    nodes:
      enabled: true
      annotationKeys: []
    devices:
      enabled: true
      annotationKeys: []
  # Minimum interval between two published changes of one resource; "0s" publishes every change.
  minPublishInterval: "0s"
  # Opt-in list and get operations. The default operation is the subscription (watch).
  query:
    enabled: false
  security:
    # Plain HTTP without TLS. For development playgrounds only.
    insecureDev: false
    tls:
      # Secret (type kubernetes.io/tls) with tls.crt and tls.key. Empty: the chart generates a
      # self-signed certificate for dtpublisher.<namespace>(.svc) into the Secret dtpublisher-tls,
      # with its CA in ca.crt for consumers to trust.
      secretName: ""
      # Client certificates: none, optional or require.
      clientAuth: "none"
      # Secret with ca.crt that client certificates are verified against. Required unless
      # clientAuth is none.
      clientCASecretName: ""
  # Consumers and the key prefixes each may read; empty allows every consumer TLS accepts.
  # Needs clientAuth optional or require. Example:
  #   consumers:
  #     - name: consumer-a          # client certificate common name
  #       prefixes: ["nodes/", "devices/"]
  access:
    consumers: []
  service:
    type: "ClusterIP"
    port: 8443
    # Set when type is NodePort.
    nodePort: ""
