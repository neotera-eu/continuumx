{{- if .Values.dtPublisher.enable }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dtpublisher
  namespace: {{ .Release.Namespace }}
  {{- with .Values.dtPublisher.labels }}
  labels: {{- toYaml . | nindent 4 }}
  {{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dtpublisher
  {{- with .Values.dtPublisher.labels }}
  labels: {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["devices.kubeedge.io"]
    resources: ["devices", "devicemodels", "devicestatuses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dtpublisher
  {{- with .Values.dtPublisher.labels }}
  labels: {{- toYaml . | nindent 4 }}
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dtpublisher
subjects:
  - kind: ServiceAccount
    name: dtpublisher
    namespace: {{ .Release.Namespace }}
{{- end }}
