Device Twins Resources Publisher (UP2DATE4SDV CID 93): self-signed server certificate, generated
at install when no dtPublisher.security.tls.secretName is given. Like the cloudcore Secret, it is
a pre-install hook, so an upgrade does not replace it. ca.crt is for consumers to trust.
*/ -}}
{{- $dp := .Values.dtPublisher }}
{{- if and $dp.enable (not $dp.security.insecureDev) (not $dp.security.tls.secretName) }}
{{- $altNames := list "dtpublisher" (printf "dtpublisher.%s" .Release.Namespace) (printf "dtpublisher.%s.svc" .Release.Namespace) (printf "dtpublisher.%s.svc.cluster.local" .Release.Namespace) }}
{{- $ca := genCA "dtpublisher-ca" 365 }}
{{- $cert := genSignedCert "dtpublisher" nil $altNames 365 $ca }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: dtpublisher-tls
  namespace: {{ .Release.Namespace }}
  {{- with $dp.labels }}
  labels: {{- toYaml . | nindent 4 }}
  {{- end }}
  annotations:
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-delete-policy": "before-hook-creation"
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca.Cert | b64enc }}
{{- end }}
