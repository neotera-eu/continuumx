{{- $dp := .Values.dtPublisher }}
{{- if $dp.enable }}
apiVersion: v1
kind: Service
metadata:
  name: dtpublisher
  namespace: {{ .Release.Namespace }}
  {{- with $dp.labels }}
  labels: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $dp.service.type }}
  ports:
    - name: i4
      port: {{ $dp.service.port }}
      protocol: TCP
      targetPort: i4
      {{- if and (eq $dp.service.type "NodePort") $dp.service.nodePort }}
      nodePort: {{ $dp.service.nodePort }}
      {{- end }}
  selector:
  {{- with $dp.labels }}
  {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
