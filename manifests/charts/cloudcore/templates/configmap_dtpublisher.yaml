{{- $dp := .Values.dtPublisher }}
{{- if $dp.enable }}
{{- $tls := $dp.security.tls }}
{{- if not (has $tls.clientAuth (list "none" "optional" "require")) }}
{{- fail (printf "dtPublisher.security.tls.clientAuth %q: want none, optional or require" $tls.clientAuth) }}
{{- end }}
{{- if and (ne $tls.clientAuth "none") (not $dp.security.insecureDev) (not $tls.clientCASecretName) }}
{{- fail "dtPublisher.security.tls.clientCASecretName is required when clientAuth is optional or require" }}
{{- end }}
{{- if and $dp.access.consumers (or $dp.security.insecureDev (eq $tls.clientAuth "none")) }}
{{- fail "dtPublisher.access.consumers needs client certificates: set security.tls.clientAuth to optional or require" }}
{{- end }}
{{- $config := dict
  "sources" $dp.sources
  "minPublishInterval" $dp.minPublishInterval
  "transport" (dict "type" "httpsse" "httpsse" (dict "address" ":8443"))
  "query" $dp.query
  "healthAddress" ":8080" }}
{{- if $dp.security.insecureDev }}
{{- $_ := set $config "security" (dict "insecureDev" true) }}
{{- else }}
{{- $serverTLS := dict "certFile" "/etc/dtpublisher/tls/tls.crt" "keyFile" "/etc/dtpublisher/tls/tls.key" "clientAuth" $tls.clientAuth }}
{{- if ne $tls.clientAuth "none" }}
{{- $_ := set $serverTLS "clientCAFile" "/etc/dtpublisher/client-ca/ca.crt" }}
{{- end }}
{{- $_ := set $config "security" (dict "tls" $serverTLS) }}
{{- end }}
{{- with $dp.access.consumers }}
{{- $_ := set $config "access" (dict "consumers" .) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dtpublisher
  namespace: {{ .Release.Namespace }}
  {{- with $dp.labels }}
  labels: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  config.yaml: |
{{ toYaml $config | indent 4 }}
{{- end }}
