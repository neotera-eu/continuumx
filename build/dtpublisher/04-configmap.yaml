#
# Device Twins Resources Publisher (UP2DATE4SDV CID 93). Generated from the cloudcore Helm
# chart with dtPublisher.enable=true (cxadm manifest --set dtPublisher.enable=true); keep in
# sync with it (checked by keadm/cmd/keadm/app/cmd/helm/dtpublisher_render_test.go).
#
# Configuration of "dtpublisher serve": publication (watch) on, list/get off, TLS on.

apiVersion: v1
kind: ConfigMap
metadata:
  name: dtpublisher
  namespace: continuumx
  labels:
    k8s-app: dtpublisher
    kubeedge: dtpublisher
data:
  config.yaml: |
    healthAddress: :8080
    minPublishInterval: 0s
    query:
      enabled: false
    security:
      tls:
        certFile: /etc/dtpublisher/tls/tls.crt
        clientAuth: none
        keyFile: /etc/dtpublisher/tls/tls.key
    sources:
      devices:
        annotationKeys: []
        enabled: true
      nodes:
        annotationKeys: []
        enabled: true
    transport:
      httpsse:
        address: :8443
      type: httpsse
