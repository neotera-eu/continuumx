# Device Twins Resources Publisher (UP2DATE4SDV CID 93). Generated from the cloudcore Helm
# chart with dtPublisher.enable=true (cxadm manifest --set dtPublisher.enable=true); keep in
# sync with it (checked by keadm/cmd/keadm/app/cmd/helm/dtpublisher_render_test.go).
#
# Before applying: create the TLS Secret "dtpublisher-tls" (type kubernetes.io/tls, keys tls.crt
# and tls.key) in namespace continuumx, for example:
#   kubectl -n continuumx create secret tls dtpublisher-tls --cert=tls.crt --key=tls.key
# The Helm chart generates a self-signed one instead when none is given.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtpublisher
  namespace: continuumx
  labels:
    k8s-app: dtpublisher
    kubeedge: dtpublisher
spec:
  replicas: 1
  selector:
    matchLabels:
      k8s-app: dtpublisher
      kubeedge: dtpublisher
  template:
    metadata:
      labels:
        k8s-app: dtpublisher
        kubeedge: dtpublisher
    spec:
      serviceAccountName: dtpublisher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dtpublisher
          image: neotera/dtpublisher:v1.23.0
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config=/etc/dtpublisher/config/config.yaml
            - --v=2
          ports:
            - name: i4
              containerPort: 8443
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          resources: 
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/dtpublisher/config
              readOnly: true
            - name: tls
              mountPath: /etc/dtpublisher/tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: dtpublisher
        - name: tls
          secret:
            secretName: dtpublisher-tls
      restartPolicy: Always
      affinity: 
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: node-role.kubernetes.io/edge
                operator: DoesNotExist
