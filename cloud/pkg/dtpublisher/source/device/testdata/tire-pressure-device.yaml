# Trimmed from the UP2DATE4SDV playground Device automotive-tire-pressure-ecu-fw-001
# (manifests/samples/devices/tire-pressure-device-instance.yaml): the six properties of
# tire-pressure-model.yaml, with the playground's initial desired values.
apiVersion: devices.kubeedge.io/v1beta1
kind: Device
metadata:
  name: automotive-tire-pressure-ecu-fw-001
  namespace: default
  resourceVersion: "200"
  labels:
    app: up2date4sdv-demo
    device-type: automotive-tire-pressure-ecu
    vehicle-domain: tire-pressure
  annotations:
    description: Four-wheel virtual TPMS ECU running separately from the thermal ECU
    vehicle-subsystem: tire-pressure-monitoring
spec:
  deviceModelRef:
    name: automotive-tire-pressure-ecu-fw-demo
  nodeName: u2deb-edge
  protocol:
    protocolName: virtual-ethernet
  stateReport:
    reportToCloud: true
    reportCycle: 60000
  properties:
  - name: frontLeftPressure
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
  - name: lowPressureWarning
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
  - name: lowPressureWheels
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
  - name: firmwareVersion
    reportToCloud: true
    collectCycle: 10000
    reportCycle: 10000
    desired:
      value: sim-1.0.0
      metadata:
        source: cloud
        reason: initial-configuration
  - name: pressureThreshold
    reportToCloud: true
    collectCycle: 20000
    reportCycle: 20000
    desired:
      value: '210.0'
      metadata:
        source: cloud
        reason: initial-configuration
  - name: leakEnabled
    reportToCloud: true
    collectCycle: 20000
    reportCycle: 20000
    desired:
      value: 'false'
      metadata:
        source: cloud
        reason: initial-configuration
