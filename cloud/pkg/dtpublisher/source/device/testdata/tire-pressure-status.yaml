#
# DeviceStatus of automotive-tire-pressure-ecu-fw-001 in the shape the Device Controller
# writes (cloud/pkg/devicecontroller/controller/upstream.go). The values are illustrative,
# not a recording: no leak, all wheels above the 210 kPa threshold.
apiVersion: devices.kubeedge.io/v1beta1
kind: DeviceStatus
metadata:
  name: automotive-tire-pressure-ecu-fw-001
  namespace: default
  resourceVersion: "300"
status:
  state: online
  lastOnlineTime: "2026-11-24T10:00:00Z"
  twins:
  - propertyName: frontLeftPressure
    reported:
      value: '230.0'
      metadata:
        timestamp: '1763978400000'
  - propertyName: lowPressureWarning
    reported:
      value: 'false'
      metadata:
        timestamp: '1763978400000'
  - propertyName: lowPressureWheels
    reported:
      value: NONE
      metadata:
        timestamp: '1763978400000'
  - propertyName: firmwareVersion
    reported:
      value: sim-1.0.0
      metadata:
        timestamp: '1763978400000'
    observedDesired:
      value: sim-1.0.0
      metadata:
        timestamp: '1763978400000'
  - propertyName: pressureThreshold
    reported:
      value: '210.0'
      metadata:
        timestamp: '1763978400000'
    observedDesired:
      value: '210.0'
      metadata:
        timestamp: '1763978400000'
  - propertyName: leakEnabled
    reported:
      value: 'false'
      metadata:
        timestamp: '1763978400000'
    observedDesired:
      value: 'false'
      metadata:
        timestamp: '1763978400000'
